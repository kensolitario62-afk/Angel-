<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root{--bg:#0f1624;--panel:#172033;--ink:#e8edf7;--muted:#9aa7bf;--snake:#7c9cff;--food:#ffd23f;--grid:#1d2940}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;touch-action:manipulation}
  h1{margin:0;font-size:1.8rem}
  .bar{display:flex;gap:24px;color:var(--muted)}
  .bar b{color:var(--ink);font-size:1.2rem}
  canvas{background:var(--panel);border-radius:10px;max-width:100%;height:auto;touch-action:none;border:2px solid var(--grid)}
  .pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px}
  .pad button{border:0;border-radius:10px;background:var(--grid);color:var(--ink);font-size:1.4rem;cursor:pointer}
  .pad button:active{background:var(--snake);color:var(--bg)}
  .pad .up{grid-column:2}
  .pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
  .actions button{background:var(--snake);color:var(--bg);border:0;padding:10px 22px;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer}
  .actions button:focus-visible,.pad button:focus-visible{outline:3px solid var(--food);outline-offset:2px}
  p{margin:0;color:var(--muted);font-size:.9rem;text-align:center}
  a{color:var(--snake)}
</style>
</head>
<body>
  <h1>Snake</h1>
  <div class="bar">
    <span>Score <b id="score">0</b></span>
    <span>Best <b id="best">0</b></span>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="actions"><button id="start">Start game</button></div>
  <div class="pad" aria-label="Controls">
    <button class="up" data-d="up" aria-label="Up">▲</button>
    <button class="left" data-d="left" aria-label="Left">◀</button>
    <button class="down" data-d="down" aria-label="Down">▼</button>
    <button class="right" data-d="right" aria-label="Right">▶</button>
  </div>
  <p>Arrow keys or WASD to move, Space to pause. On a phone, swipe or use the buttons.<br><a href="index.html">Back to portfolio</a></p>

<script>
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");
const startBtn = document.getElementById("start");
const SIZE = 20, CELLS = canvas.width / SIZE;
const DIRS = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};

let snake, dir, nextDir, food, score, timer, running = false, paused = false, over = false;
let best = 0;
try { best = +localStorage.getItem("snake-best") || 0; } catch(e){}
bestEl.textContent = best;

function reset(){
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = DIRS.right;
  score = 0; scoreEl.textContent = 0;
  over = false; paused = false;
  placeFood();
}
function placeFood(){
  do { food = {x:Math.floor(Math.random()*CELLS), y:Math.floor(Math.random()*CELLS)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function start(){
  reset();
  clearInterval(timer);
  running = true;
  timer = setInterval(tick, 120);
  startBtn.textContent = "Restart";
  draw();
}
function tick(){
  if (paused) return;
  dir = nextDir;
  const head = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};
  const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y){
    score++; scoreEl.textContent = score;
    if (score > best){ best = score; bestEl.textContent = best;
      try { localStorage.setItem("snake-best", best); } catch(e){} }
    placeFood();
  } else snake.pop();
  draw();
}
function gameOver(){
  clearInterval(timer); running = false; over = true;
  draw();
  startBtn.textContent = "Play again";
}
function draw(){
  const css = getComputedStyle(document.documentElement);
  ctx.fillStyle = css.getPropertyValue("--panel"); ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = css.getPropertyValue("--food");
  ctx.beginPath(); ctx.arc(food.x*SIZE+SIZE/2, food.y*SIZE+SIZE/2, SIZE/2-3, 0, Math.PI*2); ctx.fill();
  snake.forEach((s,i) => {
    ctx.fillStyle = css.getPropertyValue("--snake");
    ctx.globalAlpha = i === 0 ? 1 : 0.75;
    ctx.fillRect(s.x*SIZE+1, s.y*SIZE+1, SIZE-2, SIZE-2);
  });
  ctx.globalAlpha = 1;
  if (over || paused){
    ctx.fillStyle = "rgba(15,22,36,.75)"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#e8edf7"; ctx.textAlign = "center";
    ctx.font = "bold 32px system-ui"; ctx.fillText(over ? "Game over" : "Paused", 200, 190);
    ctx.font = "18px system-ui"; ctx.fillText(over ? "Score: " + score : "Press Space to continue", 200, 224);
  }
}
function turn(name){
  const d = DIRS[name];
  if (!running) return;
  if (d.x === -dir.x && d.y === -dir.y) return; // no reversing
  nextDir = d;
}
document.addEventListener("keydown", e => {
  const map = {ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down",
               ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"};
  if (map[e.key]){ e.preventDefault(); turn(map[e.key]); }
  if (e.key === " " && running){ e.preventDefault(); paused = !paused; draw(); }
});
document.querySelectorAll(".pad button").forEach(b => b.addEventListener("click", () => turn(b.dataset.d)));
startBtn.addEventListener("click", start);

// Swipe controls
let tx, ty;
canvas.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
}, {passive:true});

reset(); draw();
</script>
</body>
</html>
